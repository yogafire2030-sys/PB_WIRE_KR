# Factor Factory — 평일 아침 자동 계산 후 GitHub Pages(gh-pages 브랜치)에 게시
# main 브랜치(PB_WIRE 앱)는 건드리지 않고 gh-pages 브랜치에만 푸시합니다.
name: Factor Factory daily

on:
  schedule:
    - cron: "30 22 * * 0-4"   # KST 07:30 월~금 — 간밤 미국장 반영, KOSPI·KOSDAQ 개장 전 예상
    - cron: "40 6 * * 1-5"    # KST 15:40 월~금 — 아시아장 마감 반영, S&P500·NASDAQ 개장 전 예상
  workflow_dispatch: {}        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: factor-factory
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      FACTOR_DATA_DIR: ${{ github.workspace }}/ff_data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: factor_factory/requirements.txt

      - name: Install
        run: pip install -r factor_factory/requirements.txt

      # 이전 실행의 시세 캐시 재사용 → Yahoo/FRED 일시 장애 시에도 계산 가능
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: ff_data/cache_*.csv
          key: ff-data-${{ github.run_id }}
          restore-keys: ff-data-

      - name: Build site
        working-directory: factor_factory
        run: python build_site.py --out "$GITHUB_WORKSPACE/_site"

      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "factor-factory-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Factor Factory update $(date '+%Y-%m-%d %H:%M KST')"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

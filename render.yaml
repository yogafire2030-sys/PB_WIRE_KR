services:
  - type: web
    name: pb-global-wire-kr
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRANSLATOR
        value: auto
      - key: POLL_INTERVAL
        value: 10
      - key: FETCH_LIMIT
        value: 30
      - key: MAX_ITEMS_PER_CHANNEL
        value: 300

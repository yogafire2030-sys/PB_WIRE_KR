services:
  - type: web
    name: pb-global-wire-kr
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: TRANSLATOR
        value: auto
      - key: POLL_INTERVAL
        value: 10
      - key: FETCH_LIMIT
        value: 30
      - key: MAX_ITEMS_PER_CHANNEL
        value: 300
      - key: MARKET_POLL_INTERVAL
        value: 15
      - key: DEEPL_API_KEY
        sync: false
      - key: AZURE_TRANSLATOR_KEY
        sync: false
      - key: AZURE_TRANSLATOR_REGION
        sync: false
      - key: MYMEMORY_EMAIL
        sync: false
